<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wildlife Ecology | NPTEL Mock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap');
        
        :root {
            --forest: #166534;
        }
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        .card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
        }
        .tab-active {
            border-bottom: 3px solid #166534;
            color: #166534;
            font-weight: 600;
        }
        .option {
            transition: all 0.2s;
        }
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-emerald-950 via-green-950 to-teal-950 text-white min-h-screen">
    <div class="max-w-4xl mx-auto p-4">
        <!-- Header -->
        <div class="flex items-center justify-between mb-8 pt-6">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-leaf text-4xl text-emerald-400"></i>
                <div>
                    <h1 class="title-font text-3xl font-semibold tracking-tight">Wildlife Ecology</h1>
                    <p class="text-emerald-300 text-sm">NPTEL Mock Exam</p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="toggleTheme()" class="px-4 py-2 rounded-xl bg-white/10 hover:bg-white/20 transition-colors">
                    <i class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>

        <!-- Tabs -->
        <div class="flex border-b border-white/20 mb-8">
            <button onclick="switchMode(0)" id="tab-0" class="tab px-8 py-4 tab-active flex-1 text-center">📖 Read</button>
            <button onclick="switchMode(1)" id="tab-1" class="tab px-8 py-4 flex-1 text-center">⚡ Quiz</button>
            <button onclick="switchMode(2)" id="tab-2" class="tab px-8 py-4 flex-1 text-center">⏱️ Test</button>
        </div>

        <!-- Read Mode -->
        <div id="mode-0" class="mode">
            <div class="grid md:grid-cols-2 gap-4" id="read-list"></div>
        </div>

        <!-- Quiz Mode -->
        <div id="mode-1" class="mode hidden">
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8 card">
                <div class="flex justify-between items-center mb-6">
                    <div class="text-sm font-medium text-emerald-400" id="quiz-progress">Question <span id="q-num">1</span>/<span id="q-total"></span></div>
                    <div onclick="restartQuiz()" class="cursor-pointer text-emerald-400 hover:text-white flex items-center gap-1 text-sm">
                        <i class="fa-solid fa-rotate"></i> Restart
                    </div>
                </div>
                <div id="quiz-question" class="text-xl font-medium leading-relaxed mb-8"></div>
                <div id="quiz-options" class="space-y-3"></div>
                <div id="quiz-feedback" class="mt-6 hidden"></div>
            </div>
        </div>

        <!-- Test Mode -->
        <div id="mode-2" class="mode hidden">
            <div class="bg-white/5 backdrop-blur-xl border border-white/10 rounded-3xl p-8">
                <div class="flex justify-between mb-4">
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-emerald-400 rounded-full animate-pulse"></div>
                        <span id="test-timer" class="font-mono text-xl">20:00</span>
                    </div>
                    <div id="test-progress" class="text-sm text-white/70">0 of 0</div>
                </div>
                <div id="test-question" class="text-xl font-medium mb-8"></div>
                <div id="test-options" class="space-y-3"></div>
                
                <div class="flex gap-3 mt-10">
                    <button onclick="prevTestQuestion()" class="flex-1 py-4 rounded-2xl border border-white/20 hover:bg-white/5">Previous</button>
                    <button onclick="nextTestQuestion()" id="next-btn" class="flex-1 py-4 bg-emerald-600 hover:bg-emerald-700 rounded-2xl">Next</button>
                </div>
            </div>
            <button onclick="submitTest()" class="mt-6 w-full py-4 bg-white text-emerald-950 font-semibold rounded-3xl hidden" id="submit-test">Submit Test</button>
        </div>
    </div>

    <script src="quiz.js"></script>
</body>
</html>
